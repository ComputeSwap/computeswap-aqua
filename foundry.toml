[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
gas_limit = "300000000"
fs_permissions = [{ access = "read-write", path = "./reports" }]

[profile.default.fuzz]
runs = 512
seed = "0x2a"

[profile.deep.fuzz]
runs = 20000

[lint]
lint_on_build = false
